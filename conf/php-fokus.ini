; FOKUS - durcissement PHP suite à PHP2Shell (CVE-2026-109618 / CVE-2026-109619)
;
; A copier dans le dossier conf.d de PHP du serveur, par exemple :
;   /etc/php/8.4/apache2/conf.d/99-fokus.ini   (mod_php)
;   /etc/php/8.4/fpm/conf.d/99-fokus.ini       (PHP-FPM)
; puis redémarrer Apache ou PHP-FPM pour que tous les workers rechargent la config.
;
; Ces réglages réduisent la surface d'attaque mais ne remplacent pas la mise à jour.

; Fokus n'utilise pas la barre de progression d'upload : on la coupe.
; C'est le point d'entrée de CVE-2026-109619 (et de CVE-2026-115560, pas encore corrigée).
session.upload_progress.enabled = 0

; PHP 8.5 uniquement : évite la réutilisation d'un backtrace d'erreur fatale libéré.
fatal_error_backtraces = 0

; Taille des requêtes : la plus grosse requête légitime est l'upload de photo (4 Mo max).
post_max_size = 6M
upload_max_filesize = 4M
max_input_vars = 200
max_input_nesting_level = 8

; Pas d'erreurs affichées aux visiteurs, uniquement dans les logs.
display_errors = Off
log_errors = On
expose_php = Off
